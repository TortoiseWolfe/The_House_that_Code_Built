<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;700&amp;display=swap">
<style>body{margin:0;background:#ECDCBC;font-family:'Nunito',sans-serif;color:#2E2418}a{color:#A24A2B}a:hover{color:#7A361E}</style>
</helmet>
<section id="1" style="padding:48px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:6px;max-width:900px">
    <h1 style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:40px;margin:0">The House that Code Built — redesign</h1>
    <p style="margin:0;font-size:18px;line-height:1.6">Live page at real size. Drop-in file: <a href="house-that-code-built.html" target="_blank">house-that-code-built.html</a> (same markup, ids, classes and script; new stylesheet).</p>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
    <div id="1a" style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600">1a · Desktop 1280 · Light</div>
      <iframe src="house-that-code-built.html" title="Desktop light" data-theme-force="light" onLoad="{{ onFrameLoad }}" style="width:1280px;height:1800px;border:2.5px solid #2E2418;border-radius:16px;background:#FBF6EC;box-shadow:6px 6px 0 #2E2418"></iframe>
    </div>
    <div id="1b" style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600">1b · Desktop 1280 · Dark</div>
      <iframe src="house-that-code-built.html" title="Desktop dark" data-theme-force="dark" onLoad="{{ onFrameLoad }}" style="width:1280px;height:1800px;border:2.5px solid #2E2418;border-radius:16px;background:#1B1611;box-shadow:6px 6px 0 #2E2418"></iframe>
    </div>
    <div id="1c" style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600">1c · Phone 390 · Light</div>
      <iframe src="house-that-code-built.html" title="Phone light" data-theme-force="light" onLoad="{{ onFrameLoad }}" style="width:390px;height:2600px;border:2.5px solid #2E2418;border-radius:28px;background:#FBF6EC;box-shadow:6px 6px 0 #2E2418"></iframe>
    </div>
    <div id="1d" style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600">1d · Phone 390 · Dark</div>
      <iframe src="house-that-code-built.html" title="Phone dark" data-theme-force="dark" onLoad="{{ onFrameLoad }}" style="width:390px;height:2600px;border:2.5px solid #2E2418;border-radius:28px;background:#1B1611;box-shadow:6px 6px 0 #2E2418"></iframe>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  onFrameLoad = (e) => {
    const f = e.target;
    let d;
    try { d = f.contentDocument; } catch (_) { return; }
    if (!d) return;
    const theme = f.getAttribute('data-theme-force');
    d.documentElement.setAttribute('data-theme', theme);
    const cb = d.getElementById('checkbox');
    if (cb) cb.checked = theme === 'dark';
    const s = d.querySelector('.slider');
    if (s) s.setAttribute('aria-checked', String(theme === 'dark'));
    const fit = () => { f.style.height = (d.documentElement.scrollHeight + 4) + 'px'; };
    fit(); setTimeout(fit, 600); setTimeout(fit, 1800);
  };
  renderVals() { return { onFrameLoad: this.onFrameLoad }; }
}
</script>
</body>
</html>
